<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة PUZ STORE</title><link rel="stylesheet" href="/style.css"></head>
<body><header class="topbar"><a class="brand" href="/"><span class="brand-mark">P</span><span>PUZ<span class="cyan">STORE</span></span></a><nav><a href="/">عرض المتجر</a></nav></header>
<main class="section"><p class="eyebrow">STORE MANAGEMENT</p><h1>لوحة تحكم PUZ</h1><div id="login-box" class="modal-card" style="max-width:500px;margin:25px 0"><h2>تسجيل الدخول</h2><input id="password" class="field" type="password" placeholder="كلمة مرور الإدارة"><button id="login" class="btn primary full">دخول</button><div id="login-error" class="note"></div></div>
<div id="dashboard" class="hidden"><div class="section-head"><h2>المنتجات</h2><button class="small-btn" id="new-product">+ إضافة منتج</button></div><div id="admin-products" class="products-grid"></div>
<div id="editor" class="modal-card hidden" style="max-width:650px;margin-top:25px"><h2 id="editor-title">إضافة منتج</h2><form id="product-form"><input type="hidden" id="product-id"><label>اسم المنتج</label><input class="field" id="title" required maxlength="90"><label>وصف المنتج</label><textarea class="field" id="description" rows="4"></textarea><label>السعر بالريال</label><input class="field" id="price" type="number" min="1" step=".01" required><label>ملف المنتج (ZIP أو إعدادات)</label><input class="field" id="file" type="file"><label><input type="checkbox" id="published" checked> منشور في المتجر</label><p class="note">في هذا الإصدار تُخزّن الملفات داخل D1؛ استخدم ملفات صغيرة (يفضل أقل من 5MB).</p><button class="btn primary full" type="submit">حفظ المنتج</button><div id="save-status" class="note"></div></form></div></div></main><script src="/admin.js"></script></body></html>
